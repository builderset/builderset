name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: '@builderset/email 0.3.0, react 19.2'
    validations:
      required: true
  - type: dropdown
    id: kit
    attributes:
      label: Kit
      options:
        - email
        - article
        - engine (any kit)
        - Python package
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and browser
      placeholder: 'Next.js 16, Chrome 142'
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest document, code or steps that show it.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: A reproduction
      description: A fork of one of the examples (examples/next-shadcn or examples/vite-react) that shows it, or a playground document.
