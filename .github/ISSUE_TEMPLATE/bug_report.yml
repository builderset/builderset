name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: packages
    attributes:
      label: Packages and versions
      placeholder: '@builderset/email 0.1.0, react 19.2'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest document, code or steps that show it.
    validations:
      required: true
