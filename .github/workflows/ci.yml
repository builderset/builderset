name: CI

on:
  pull_request:
  push:
    branches: [development, staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, format, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, for the secret scan.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # --frozen-lockfile: fail on a lockfile that does not match the
      # manifests, rather than silently resolving something else.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # A pull request that changes a package says so in a changeset. Not the
      # two release pull requests, which change the packages by consuming the
      # changesets: "Version packages" (changeset-release/production into
      # production) and the merge of production back into development.
      - name: A changeset for every package change
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref != 'production' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
      # lint and typecheck built the packages; this checks what was built:
      # 'use client' lines, imports, the manifests (publint) and the types as
      # each kind of consumer resolves them (arethetypeswrong).
      - run: pnpm check:packages
      # The props tables in the packages' READMEs are generated from the built
      # types; this fails when one is out of date (fix: pnpm readme:props).
      - run: node tooling/readme-props.mjs --check
      # While the repository is private, GitHub's own secret scanning is not
      # available on the free plan (docs/plan/steps/08_NEW_REPOSITORY.md, part 6).
      - name: Secret scan
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --redact --no-banner

  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version on a push to development, staging or production; one
        # on a pull request, to save the private repository's Actions minutes.
        node: ${{ fromJSON(github.event_name == 'push' && '[20, 22, 24]' || '[24]') }}
    steps:
      - uses: actions/checkout@v5
      # Standalone: pnpm 11 runs on its own Node, so the tests can use Node 20,
      # which pnpm itself no longer supports.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      # Install and build on Node 24: the build tool needs Node 22 or newer.
      # What it writes is what the tests below load.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Every test
        if: matrix.node != 20
        run: pnpm test
      # On Node 20 only what a server imports: the `core`, `render` and `host`
      # entries are promised to Node 20 and newer, and the `*.node.test.ts`
      # suites load them with no DOM. The rest of the suites need jsdom, which
      # needs Node 22.
      - name: Server entries only
        if: matrix.node == 20
        run: pnpm --filter "./packages/*" exec vitest run --project node
      # The email renderer in a plain Node script, against the golden files.
      - name: examples/node-render
        if: matrix.node == 20
        run: pnpm --filter example-node-render test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported version on a push to development, staging or
        # production; the newest on a pull request, as the Node tests do.
        python: ${{ fromJSON(github.event_name == 'push' && '["3.11", "3.12", "3.13", "3.14"]' || '["3.14"]') }}
    defaults:
      run:
        working-directory: python
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # The whole repository: the tests read packages/*/fixtures and the build
      # copies packages/*/schema into the package.
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: One version for npm and Python
        run: node ../tooling/sync-python-version.mjs --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      # The tests pass in the repository, where the JSON files sit beside the
      # code. The wheel must carry them: build it and use it from a clean
      # environment, outside the repository's import path.
      - name: The built wheel, installed
        run: |
          uv build
          uv run --isolated --no-project --with dist/*.whl python ../tooling/python-wheel-smoke.py ../packages
