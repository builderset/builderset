spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/builder}
spring.datasource.username=${DATABASE_USER:builder}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway runs db/migration/V1__base.sql … V8__popups.sql; Hibernate only
# checks that the entities match the tables, and never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Answers are built inside the service's transaction, never while the view renders.
spring.jpa.open-in-view=false
# The people on a page of rows are loaded in one query, not one per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# The API's names are the data model's: saved_at, draft_document, expected_saved_at.
spring.jackson.property-naming-strategy=SNAKE_CASE

# An upload larger than the library takes is refused before it is read: 413.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# The Builderset checker, on a private port beside the app.
builderset.checker.url=${CHECKER_URL:http://127.0.0.1:4319}
# Where uploads are kept, and your site as visitors reach it: emails link their images there.
builderset.uploads.dir=${UPLOAD_DIR:uploads}
builderset.public-origin=${PUBLIC_ORIGIN:http://localhost:8080}
# Whether a popup submission keeps the visitor's IP: only if your privacy rules allow it.
builderset.popups.store-ip=false
# The stand-in sign-in: every request of your team's is this user. Unset in production.
builderset.dev-user-email=${DEV_USER_EMAIL:}

# The kits' schemas also carry facts of their own (`x-elements`, `x-limits`) for
# other tools; the validator checks the standard keywords and skips those.
logging.level.com.networknt.schema.UnknownKeywordFactory=error
