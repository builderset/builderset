packages:
  - 'packages/*'
  - 'examples/*'
  - 'apps/*'

# pnpm runs no dependency's install script unless it is listed here. The
# Tailwind CLI's file watcher ships prebuilt binaries; its script only compiles
# one from source when none fits, so it is reviewed and left off.
allowBuilds:
  '@parcel/watcher': false
  # The docs site's MDX compiler (fumadocs-mdx). Its script only checks the native
  # binary that its platform package (@esbuild/<os>-<arch>) already installed.
  esbuild: false
